# editor.satoru.net … さとるエディタのサイト (静的ファイル配信)。トップ・画像 (/site/)・ダウンロード
# （Cloudflare 経由。ほかのサブドメインと同じく 80/443 の両方を受ける）
server {
    listen 80;
    listen 443 ssl http2;
    server_name editor.satoru.net;

    ssl_certificate     /etc/nginx/cf.crt;
    ssl_certificate_key /etc/nginx/cf.pkey;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/sites/editor.satoru.net;
    index index.html;

    location ~ /\. {
        deny all;
        return 404;
    }
    location /site/ {
        expires 1d;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

# 旧URL → 新URL
server {
    listen 80;
    listen 443 ssl http2;
    server_name editer.satoru.net sakubun.satoru.net;

    ssl_certificate     /etc/nginx/cf.crt;
    ssl_certificate_key /etc/nginx/cf.pkey;

    return 301 https://editor.satoru.net$request_uri;
}
