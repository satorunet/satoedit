# docs.satoru.net … さとるエディタのサイト (トップ) と「リンクで公開」
#   /                       サイトのトップ (静的ファイル /var/www/sites/docs.satoru.net/index.html)
#   /site/…                 トップの画像など
#   /SatoruEditor-*         ダウンロード (Mac の dmg・Windows のインストーラーと zip)
#   それ以外                 「リンクで公開」(Python, 127.0.0.1:3720)。/r/<id> で読むページ、/admin は管理画面
# （Cloudflare 経由。ほかのサブドメインと同じく 80/443 の両方を受ける）
server {
    listen 80;
    listen 443 ssl http2;
    server_name docs.satoru.net;

    ssl_certificate     /etc/nginx/cf.crt;
    ssl_certificate_key /etc/nginx/cf.pkey;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/sites/docs.satoru.net;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location /site/ {
        expires 1d;
        try_files $uri =404;
    }
    location ~ ^/SatoruEditor-[A-Za-z0-9._-]+\.(dmg|zip|exe)$ {
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:3720;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 9m;   # 画面の画像 (PNG) も送るため
    }
}

# 前のサイトの URL → docs.satoru.net (ダウンロードのファイル名もそのまま)
server {
    listen 80;
    listen 443 ssl http2;
    server_name editor.satoru.net editer.satoru.net sakubun.satoru.net;

    ssl_certificate     /etc/nginx/cf.crt;
    ssl_certificate_key /etc/nginx/cf.pkey;

    return 301 https://docs.satoru.net$request_uri;
}
