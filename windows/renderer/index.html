<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src blob:; connect-src satoplug:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エディタβ</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-chrome="light">
<div id="app">
  <div id="toolbar" role="toolbar"></div>
  <div id="tabbar"><div id="tabs" role="tablist"></div><button id="tab-add" aria-label="＋">＋</button></div>
  <div id="main">
    <div id="library-pane" hidden></div>
    <div id="tree-pane" hidden></div>
    <div id="tree-resizer" hidden></div>
    <div id="remote-pane" hidden></div>
    <div id="remote-resizer" hidden></div>
    <div id="center">
      <canvas id="ruler" hidden></canvas>
      <div id="editors"></div>
      <div id="grep-pane" hidden></div>
    </div>
    <div id="diff-pane" hidden></div>
    <div id="ai-pane" hidden></div>
    <div id="chat-pane" hidden></div>
  </div>
  <div id="statusbar">
    <div id="status-notes"></div>
    <label id="status-format" class="check-row" hidden><input type="checkbox"><span></span></label>
    <div id="status-cells"></div>
  </div>
</div>
<div id="overlays"></div>
<script src="dist/app.js"></script>
</body>
</html>
