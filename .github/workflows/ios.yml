# iPhone / iPad 版 (ios/) を GitHub の Mac で組み立てる。
# - main に ios/ や共通の中身 (mac/Sources/HinokiCore) の変更が入るたび: シミュレーター用にビルドして、壊れていないか確かめる
# - 「Actions > iOS > Run workflow」で upload にチェック: 署名して App Store Connect (TestFlight) に上げる
#   要る Secrets (Settings > Secrets and variables > Actions):
#     ASC_KEY_ID     … App Store Connect API キーの ID
#     ASC_ISSUER_ID  … 発行者 ID (Issuer ID)
#     ASC_KEY_P8     … ダウンロードした AuthKey_XXXX.p8 の中身 (テキストそのまま)
#   署名の証明書とプロファイルは、Xcode の自動署名がこの API キーで作る (証明書ファイルを預ける必要はない)
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "mac/Sources/HinokiCore/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "署名して App Store Connect (TestFlight) に上げる"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: いちばん新しい Xcode を使う
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: プロジェクトを作る
        working-directory: ios
        env:
          SATORU_IOS_BUILD: ${{ github.run_number }}
        run: python3 scripts/gen_xcodeproj.py

      - name: シミュレーター用にビルド (確かめ)
        working-directory: ios
        run: |
          xcodebuild -project SatoruEditor.xcodeproj -scheme SatoruEditor -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: 署名して App Store Connect に上げる
        if: ${{ inputs.upload }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "Secrets (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8) が足りません"; exit 1; }
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project SatoruEditor.xcodeproj -scheme SatoruEditor -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/SatoruEditor.xcarchive "${AUTH[@]}" archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>99NFJH4MCR</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/SatoruEditor.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}"
          rm -f "$KEY"
